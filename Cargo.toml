[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/louisparkes-talbot/visualdebug"
rust-version = "1.85"

[workspace.dependencies]
visualdebug-core = { path = "crates/visualdebug-core", version = "0.1.0" }
visualdebug-viewer = { path = "crates/visualdebug-viewer", version = "0.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
strip = true
