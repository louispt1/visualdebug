[package]
name = "visualdebug"
description = "Record how code executes, scrub through it in a self-contained HTML viewer, annotated for PR review"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["debugger", "tracing", "code-review", "ruby", "python"]
categories = ["development-tools::debugging", "command-line-utilities"]
exclude = ["probes/**/__pycache__", "probes/*/test", "probes/*/tests"]

[[bin]]
name = "visualdebug"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
visualdebug-core.workspace = true
visualdebug-viewer.workspace = true
clap = { version = "4", features = ["derive"] }
directories = "6"
opener = "0.8"
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["filters"] }
